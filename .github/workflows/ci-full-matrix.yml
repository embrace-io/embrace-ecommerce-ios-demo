name: Full Matrix Tests

# Manual trigger only — use for comprehensive testing before demos or releases.
#
# Every test job builds from source rather than sharing one prebuilt bundle.
# RUN_SOURCE is compiled into the UI test binary, and this workflow's whole
# purpose is per-device/per-test tagging, so a shared build would tag all 18
# combinations identically and make the results indistinguishable on the
# dashboard. Actions minutes are free on this public repo; the cost is wall
# clock, not money.
on:
  workflow_dispatch:
    inputs:
      include_ipad:
        description: 'Include iPad in device matrix'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PROJECT_NAME: "Embrace Ecommerce"
  SCHEME_NAME: "Embrace Ecommerce"
  # Pinned image: macos-latest moved to macOS 26, which does not ship Xcode 16.x.
  XCODE_VERSION: "16.4"

concurrency:
  group: full-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validates the build once before 18 test jobs spin up, and uploads dSYMs a
  # single time. The old build job produced no dSYMs at all (it omitted
  # DEBUG_INFORMATION_FORMAT) and never called the symbol uploader, so crashes
  # from this matrix arrived unsymbolicated.
  symbols:
    name: Verify Build and Upload Symbols
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode version
        run: bash scripts/select-xcode.sh

      - name: Configure Embrace app ID
        env:
          APP_ID: ${{ vars.APP_ID }}
        run: bash scripts/configure-app-id.sh

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Find simulator
        id: simulator
        run: |
          # Assign first: `echo "udid=$(...)"` would mask a nonzero exit from the
          # script and hand the next step an empty UDID.
          udid="$(bash scripts/find-simulator.sh "iPhone 16")"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      - name: Upload dSYMs to Embrace
        env:
          EMBRACE_APP: ${{ vars.APP_ID }}
          EMBRACE_API_TOKEN: ${{ secrets.EMBRACE_API_TOKEN }}
        run: bash scripts/upload-dsyms.sh DerivedData/Build/Products

  test:
    name: "${{ matrix.device }} - ${{ matrix.test_suite.name }}"
    needs: symbols
    runs-on: macos-15
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        device:
          - "iPhone 16"
          - "iPhone 16 Pro"
          - "iPhone SE (3rd generation)"
        test_suite:
          - name: "Guest Auth"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testAuthenticationGuestFlow"
            run_source: "matrix-auth"
          - name: "Browse Flow"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testBrowseFlow"
            run_source: "matrix-browse"
          - name: "Add to Cart"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testAddToCartFlow"
            run_source: "matrix-cart"
          - name: "Search Flow"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testSearchFlow"
            run_source: "matrix-search"
          - name: "Checkout Flow"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testCheckoutFlow"
            run_source: "matrix-checkout"
          - name: "Multi-Session Timeline"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testMultiSessionTimeline"
            run_source: "matrix-timeline"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode version
        run: bash scripts/select-xcode.sh

      - name: Configure Embrace app ID
        env:
          APP_ID: ${{ vars.APP_ID }}
        run: bash scripts/configure-app-id.sh

      # Must precede the build: RUN_SOURCE is a compile-time literal.
      - name: Configure RUN_SOURCE
        env:
          DEVICE: ${{ matrix.device }}
          SUITE_RUN_SOURCE: ${{ matrix.test_suite.run_source }}
        run: |
          device_short="$(printf '%s' "$DEVICE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/iphone //; s/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          RUN_SOURCE="${SUITE_RUN_SOURCE}-${device_short}"
          export RUN_SOURCE
          bash scripts/configure-run-source.sh

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Setup simulator
        id: simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          # Assign first: `echo "udid=$(...)"` would mask a nonzero exit from the
          # script and hand the next step an empty UDID.
          udid="$(bash scripts/find-simulator.sh "$DEVICE" --boot)"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      - name: Run test
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_TARGET: ${{ matrix.test_suite.target }}
        run: |
          # Exit code ignored: these flows crash the app on purpose in ~35% of
          # runs. The verification step below decides if the run was broken.
          xcodebuild test-without-building \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -only-testing:"${TEST_TARGET}" \
            -resultBundlePath "TestResults.xcresult" || true

      - name: Verify the test actually ran
        env:
          LABEL: "${{ matrix.device }} / ${{ matrix.test_suite.name }}"
        run: python3 scripts/check-test-run.py TestResults.xcresult "$LABEL"

      - name: Cleanup
        if: always()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          killall Simulator 2>/dev/null || true
          if [[ -n "$SIMULATOR_UDID" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi

  # Optional iPad tests - only runs if include_ipad is true
  test-ipad:
    name: "iPad - ${{ matrix.test_suite.name }}"
    if: ${{ inputs.include_ipad }}
    needs: symbols
    runs-on: macos-15
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        test_suite:
          - name: "Guest Auth"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testAuthenticationGuestFlow"
            run_source: "matrix-auth-ipad"
          - name: "Browse Flow"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testBrowseFlow"
            run_source: "matrix-browse-ipad"
          - name: "Search Flow"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testSearchFlow"
            run_source: "matrix-search-ipad"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode version
        run: bash scripts/select-xcode.sh

      - name: Configure Embrace app ID
        env:
          APP_ID: ${{ vars.APP_ID }}
        run: bash scripts/configure-app-id.sh

      - name: Configure RUN_SOURCE
        env:
          RUN_SOURCE: ${{ matrix.test_suite.run_source }}
        run: bash scripts/configure-run-source.sh

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Setup iPad simulator
        id: simulator
        run: |
          # Assign first: `echo "udid=$(...)"` would mask a nonzero exit from the
          # script and hand the next step an empty UDID.
          udid="$(bash scripts/find-simulator.sh "iPad Pro" --boot)"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      - name: Run test
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_TARGET: ${{ matrix.test_suite.target }}
        run: |
          xcodebuild test-without-building \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -only-testing:"${TEST_TARGET}" \
            -resultBundlePath "TestResults.xcresult" || true

      - name: Verify the test actually ran
        env:
          LABEL: "iPad / ${{ matrix.test_suite.name }}"
        run: python3 scripts/check-test-run.py TestResults.xcresult "$LABEL"

      - name: Cleanup
        if: always()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          killall Simulator 2>/dev/null || true
          if [[ -n "$SIMULATOR_UDID" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi

  summary:
    name: Test Summary
    needs: [symbols, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          {
            echo "## Full Matrix Test Results"
            echo ""
            echo "### Configuration"
            echo "- **Devices:** iPhone 16, iPhone 16 Pro, iPhone SE (3rd generation)"
            echo "- **Tests:** Guest Auth, Browse Flow, Add to Cart, Search Flow, Checkout Flow, Multi-Session Timeline"
            echo "- **Total combinations:** 18 (3 devices x 6 tests)"
            echo ""
            echo "### Session Diversity"
            echo "Each job tags its sessions \`matrix-{test}-{device}\` via RUN_SOURCE."
            echo ""
            echo "Individual job results are above. A red job means the test never"
            echo "executed; an intentional app crash keeps the job green and is"
            echo "reported in that job's summary."
          } >> "$GITHUB_STEP_SUMMARY"
