name: Scheduled Tests (Lightweight)

# Runs every 2 hours to maintain steady session flow to the dashboard.
# Each test suite runs as its own job on its own simulator, so each produces a
# distinct device identity — non-stitched sessions, complementing
# one-simulator.yml which produces stitched ones.
#
# Each job builds from source. It previously tried to reuse artifacts from
# build.yml, but RUN_SOURCE is compiled into the UI test binary, so a reused
# build tagged every session "UITest" and defeated the point of the per-suite
# tags below. Actions minutes are free on this public repo, so building per job
# is the cheaper trade.
#
# Fans out across app IDs as well as test suites. The Embrace SDK takes a single
# appId per process (Embrace.Options(appId:) on a singleton client), so one app
# run cannot feed two app IDs — instead each app ID gets its own build, because
# the ID is compiled into SDKConfiguration.swift. Separate jobs also keep the two
# apps on separate simulators, which matters: they share a bundle ID, so a crash
# report persisted under one app ID could otherwise be shipped under the other's
# configuration on the next launch.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: "Embrace Ecommerce"
  SCHEME_NAME: "Embrace Ecommerce"
  # Pinned image: macos-latest moved to macOS 26, which does not ship Xcode 16.x.
  XCODE_VERSION: "16.4"
  DEVICE_NAME: "iPhone 16"

concurrency:
  group: scheduled-tests
  # Do not cancel a run in progress. These runs exist to produce sessions, so
  # killing one mid-test throws away both the build and the traffic it was about
  # to generate. A run takes ~30 min against a 2h cadence, so overlap is rare and
  # queueing is cheaper than cancelling.
  cancel-in-progress: false

jobs:
  # Builds the app-ID target list from repository variables, so adding or
  # removing a second app is a variables-only change with no workflow edit. A
  # target whose variable is unset is simply absent, which keeps a missing or
  # retired sandbox app from turning the primary session stream red.
  targets:
    name: Resolve app targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Resolve configured app IDs
        id: resolve
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_ID_SANDBOX: ${{ vars.APP_ID_SANDBOX }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          candidates = [
              # (name, app id variable, dSYM token secret, RUN_SOURCE suffix)
              ("primary", "APP_ID", "EMBRACE_API_TOKEN", ""),
              ("sandbox", "APP_ID_SANDBOX", "EMBRACE_API_TOKEN_SANDBOX", "-sandbox"),
          ]

          targets = [
              {"name": name, "app_id_var": var, "token_secret": secret, "suffix": suffix}
              for name, var, secret, suffix in candidates
              if os.environ.get(var)
          ]
          print("targets=" + json.dumps(targets))
          PY

          echo "Resolved targets:"
          grep '^targets=' "$GITHUB_OUTPUT" | tail -1

      - name: Fail if no app IDs are configured
        env:
          APP_ID: ${{ vars.APP_ID }}
        run: |
          if [[ -z "$APP_ID" ]]; then
            echo "::error::APP_ID is not set — no sessions can be generated." >&2
            exit 1
          fi

  run-tests:
    name: "${{ matrix.test_suite.name }} (${{ matrix.target.name }})"
    needs: targets
    runs-on: macos-15
    # Covers a from-source build (~10-20 min) plus the test and flush runs.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
        test_suite:
          - name: "Browse Products"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testBrowseFlow"
            run_source: "scheduled-browse"
          - name: "Guest Auth"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testAuthenticationGuestFlow"
            run_source: "scheduled-auth"
          - name: "Checkout Flow"
            target: "Embrace EcommerceUITests/Embrace_EcommerceUITests/testCheckoutFlow"
            run_source: "scheduled-checkout"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode version
        run: bash scripts/select-xcode.sh

      # Indexed off the matrix so each target compiles in its own app ID.
      - name: Configure Embrace app ID
        env:
          APP_ID: ${{ vars[matrix.target.app_id_var] }}
        run: bash scripts/configure-app-id.sh

      # Must precede the build: RUN_SOURCE is a compile-time literal. The target
      # suffix keeps the two apps' session streams distinguishable side by side.
      - name: Configure RUN_SOURCE
        env:
          RUN_SOURCE: "${{ matrix.test_suite.run_source }}${{ matrix.target.suffix }}"
        run: bash scripts/configure-run-source.sh

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Setup simulator
        id: simulator
        run: |
          # Assign first: `echo "udid=$(...)"` would mask a nonzero exit from the
          # script and hand the next step an empty UDID.
          udid="$(bash scripts/find-simulator.sh "$DEVICE_NAME" --boot)"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      # continue-on-error so a bad EMBRACE_API_TOKEN cannot stop session traffic:
      # generating sessions is this workflow's primary job, and symbolication is
      # secondary. The gate at the end of the job still turns the run red.
      - name: Upload dSYMs to Embrace
        id: dsyms
        continue-on-error: true
        env:
          # Tokens are org-scoped, so each app ID needs the token from its own
          # organization.
          EMBRACE_APP: ${{ vars[matrix.target.app_id_var] }}
          EMBRACE_API_TOKEN: ${{ secrets[matrix.target.token_secret] }}
        run: bash scripts/upload-dsyms.sh DerivedData/Build/Products

      - name: Run test
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_TARGET: ${{ matrix.test_suite.target }}
          RESULT_BUNDLE: "TestResults-${{ matrix.test_suite.run_source }}${{ matrix.target.suffix }}.xcresult"
        run: |
          # The exit code is intentionally ignored: these flows call
          # calculateAndCreateCrash(), which crashes the app on purpose in ~35% of
          # runs, and XCTest reports that as a failure. The verification step
          # below decides whether the run was actually broken.
          xcodebuild test-without-building \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -parallel-testing-enabled NO \
            -derivedDataPath DerivedData \
            -only-testing:"${TEST_TARGET}" \
            -resultBundlePath "${RESULT_BUNDLE}" || true

      - name: Flush pending crash report
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          # If the test above crashed, the report is on disk but unsent. Relaunch
          # the app on the SAME simulator so the SDK ships it. Do not erase or
          # reinstall between the two runs — the payload must survive.
          xcodebuild test-without-building \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -parallel-testing-enabled NO \
            -derivedDataPath DerivedData \
            -only-testing:"Embrace EcommerceUITests/Embrace_EcommerceUITests/testQuickBrowseAndLeave" \
            -resultBundlePath "TestResults-flush.xcresult" || true

      - name: Verify the test actually ran
        env:
          RESULT_BUNDLE: "TestResults-${{ matrix.test_suite.run_source }}${{ matrix.target.suffix }}.xcresult"
          SUITE_NAME: "${{ matrix.test_suite.name }} (${{ matrix.target.name }})"
        run: python3 scripts/check-test-run.py "$RESULT_BUNDLE" "$SUITE_NAME"

      # The artifact name must include the target suffix: upload-artifact@v4
      # errors on duplicate names, and both targets share a run_source.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test_suite.run_source }}${{ matrix.target.suffix }}
          path: |
            TestResults-${{ matrix.test_suite.run_source }}${{ matrix.target.suffix }}.xcresult
            TestResults-flush.xcresult
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          killall Simulator 2>/dev/null || true
          if [[ -n "$SIMULATOR_UDID" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi

      # Runs after the tests so a symbol failure is reported without costing a
      # run's worth of sessions.
      - name: Fail if dSYM upload failed
        if: always() && steps.dsyms.outcome == 'failure'
        run: |
          echo "::error::dSYM upload failed for target '${{ matrix.target.name }}' — crashes will not symbolicate."
          echo "Check the ${{ matrix.target.token_secret }} secret and that ${{ matrix.target.app_id_var }} still exists." >&2
          exit 1
