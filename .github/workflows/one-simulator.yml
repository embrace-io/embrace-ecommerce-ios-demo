name: One Simulator (Session Stitching)

# Runs all UI tests sequentially on ONE simulator so the sessions share a device
# identity, which is what produces stitched sessions in the Embrace dashboard.
# The iOS counterpart to Android's one-emulator.yml.
#
# Offset an hour from ci-scheduled.yml so the dashboard gets a mix of stitched
# and non-stitched traffic.
#
# Note: this workflow had never completed a single successful run before the
# Xcode/runner fix — it was added after macos-latest moved to macOS 26, so every
# run died at `xcode-select` and scripts/run-all-tests.sh never executed once.
on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: "Embrace Ecommerce"
  SCHEME_NAME: "Embrace Ecommerce"
  # Pinned image: macos-latest moved to macOS 26, which does not ship Xcode 16.x.
  XCODE_VERSION: "16.4"
  DEVICE_NAME: "iPhone 16"

concurrency:
  group: one-simulator-tests
  cancel-in-progress: false

jobs:
  run-all-tests:
    name: "Run All Tests (Stitched Sessions)"
    runs-on: macos-15
    # 11 tests run sequentially, each with a 10s SDK settle in setUp, plus a
    # from-source build.
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode version
        run: bash scripts/select-xcode.sh

      - name: Configure Embrace app ID
        env:
          APP_ID: ${{ vars.APP_ID }}
        run: bash scripts/configure-app-id.sh

      # Must precede the build: RUN_SOURCE is a compile-time literal.
      - name: Configure RUN_SOURCE
        env:
          RUN_SOURCE: "one-simulator-stitched"
        run: bash scripts/configure-run-source.sh

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Setup simulator
        id: simulator
        run: |
          # Assign first: `echo "udid=$(...)"` would mask a nonzero exit from the
          # script and hand the next step an empty UDID.
          udid="$(bash scripts/find-simulator.sh "$DEVICE_NAME" --boot)"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      # continue-on-error so a bad EMBRACE_API_TOKEN cannot stop session traffic:
      # generating stitched sessions is this workflow's primary job, and
      # symbolication is secondary. The gate at the end still turns the run red.
      - name: Upload dSYMs to Embrace
        id: dsyms
        continue-on-error: true
        env:
          EMBRACE_APP: ${{ vars.APP_ID }}
          EMBRACE_API_TOKEN: ${{ secrets.EMBRACE_API_TOKEN }}
        run: bash scripts/upload-dsyms.sh DerivedData/Build/Products

      - name: Run all tests sequentially (creates stitched sessions)
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          DERIVED_DATA_PATH: DerivedData
          SCHEME: ${{ env.SCHEME_NAME }}
        run: bash scripts/run-all-tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitched-session-results
          path: |
            result-*.txt
            result-*.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          killall Simulator 2>/dev/null || true
          if [[ -n "$SIMULATOR_UDID" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi

      # Runs after the tests so a symbol failure is reported without costing a
      # run's worth of sessions.
      - name: Fail if dSYM upload failed
        if: always() && steps.dsyms.outcome == 'failure'
        run: |
          echo "::error::dSYM upload failed — crashes from this build will not symbolicate."
          echo "Check the EMBRACE_API_TOKEN secret and that APP_ID still exists." >&2
          exit 1
