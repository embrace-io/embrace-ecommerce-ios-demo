name: Build and Upload Symbols

# Verifies the app and UI test bundle compile on every push to main, and keeps
# dSYMs uploaded to Embrace so crashes from that commit symbolicate.
#
# This workflow used to publish test-build-artifacts / xctestrun-file for the
# scheduled workflows to reuse. That never worked in practice: it only ran on
# push, artifacts expire after 7 days, and the last push was months before the
# schedules ran — so the consumers always fell back to building from source.
# Worse, reusing a prebuilt bundle silently defeated the per-workflow RUN_SOURCE
# tagging, because RUN_SOURCE is compiled into the UI test binary. The consumers
# now build from source (Actions minutes are free on this public repo), so the
# artifacts are gone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: "Embrace Ecommerce"
  SCHEME_NAME: "Embrace Ecommerce"
  # Pinned image: macos-latest moved to macOS 26, which does not ship Xcode 16.x.
  # scripts/select-xcode.sh falls back to the newest available Xcode if this
  # version disappears from the image.
  XCODE_VERSION: "16.4"
  DEVICE_NAME: "iPhone 16"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Upload Symbols
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode version
        run: bash scripts/select-xcode.sh

      - name: Configure Embrace app ID
        env:
          APP_ID: ${{ vars.APP_ID }}
        run: bash scripts/configure-app-id.sh

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v5
        with:
          # SPM checkouts land under the -derivedDataPath, not the default
          # DerivedData location the old config cached.
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Find simulator
        id: simulator
        run: |
          # Assign first: `echo "udid=$(...)"` would mask a nonzero exit from the
          # script and hand the next step an empty UDID.
          udid="$(bash scripts/find-simulator.sh "$DEVICE_NAME")"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      - name: Upload dSYMs to Embrace
        env:
          EMBRACE_APP: ${{ vars.APP_ID }}
          EMBRACE_API_TOKEN: ${{ secrets.EMBRACE_API_TOKEN }}
        run: bash scripts/upload-dsyms.sh DerivedData/Build/Products

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "- **Project:** ${PROJECT_NAME}"
            echo "- **Xcode:** $(xcodebuild -version | head -1)"
            echo "- **Runner:** ${RUNNER_OS} (macos-15)"
            echo "- **Commit:** ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
